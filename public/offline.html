<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a3640" />
    <title>FreelanceCRM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f1f7f6; color: #0c2229;
      }
      @media (prefers-color-scheme: dark) { body { background: #07171c; color: #e3f0f1; } }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #4d6a70; }
      @media (prefers-color-scheme: dark) { p { color: #93b4ba; } }
      button {
        height: 44px; padding: 0 24px; border: 0; border-radius: 10px; cursor: pointer;
        font: inherit; font-weight: 600; background: #0b7a80; color: #fff;
      }
      button:focus-visible { outline: 3px solid #7fe0d9; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="title"></h1>
      <p id="text"></p>
      <button id="retry" type="button"></button>
    </main>
    <script>
      var texts = {
        uk: ["Немає з'єднання", "Перевірте інтернет і спробуйте ще раз. Ваші дані в безпеці.", "Спробувати ще раз"],
        en: ["You are offline", "Check your internet connection and try again. Your data is safe.", "Try again"],
        pl: ["Brak połączenia", "Sprawdź internet i spróbuj ponownie. Twoje dane są bezpieczne.", "Spróbuj ponownie"],
        cs: ["Bez připojení", "Zkontrolujte internet a zkuste to znovu. Vaše data jsou v bezpečí.", "Zkusit znovu"],
      };
      var lang = (navigator.language || "uk").slice(0, 2);
      var t = texts[lang] || texts.uk;
      document.documentElement.lang = texts[lang] ? lang : "uk";
      document.title = t[0] + " | FreelanceCRM";
      document.getElementById("title").textContent = t[0];
      document.getElementById("text").textContent = t[1];
      var button = document.getElementById("retry");
      button.textContent = t[2];
      button.addEventListener("click", function () { location.reload(); });
    </script>
  </body>
</html>
